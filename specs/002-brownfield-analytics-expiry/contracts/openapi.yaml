openapi: 3.0.3
info:
  title: URL Shortener API
  version: 0.2.0
  description: |
    Contract for feature 002 (expiry, click analytics, off-path recording), extending feature 001's
    contract. Source of truth for the HTTP interface, reviewed alongside [http-api.md](http-api.md).

    - All errors are RFC 7807 ProblemDetails (`application/problem+json`).
    - Validation errors use the ValidationProblemDetails shape with an `errors` object keyed by field.
    - Short URLs are always built from the configured public base URL, never from the request `Host`.
    - Click counts are eventually consistent: a redirect appears in counts within 5 seconds.
    - Not in this version: rate limiting (429, feature 003).

    **Postman tip:** to see the `302` from `GET /{code}` instead of the destination page, turn off
    *Settings → Automatically follow redirects* for that request.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:5058
    description: Local `dotnet run` (http launch profile)
  - url: http://localhost:8080
    description: Docker Compose

tags:
  - name: Links
    description: Create short links and view their details
  - name: Redirect
    description: Follow a short URL
  - name: Health
    description: Service and database health

paths:
  /api/links:
    post:
      tags: [Links]
      operationId: createLink
      summary: Create a short link
      description: |
        Creates a short link with a generated 7-character Base62 code, or with the given custom
        alias. Submitting the same URL twice creates two different links.

        A custom alias whose current link **has expired** is reclaimed: the expired link and its
        click history are deleted and the code now belongs to the new link. Exactly one of several
        concurrent claims succeeds; the others get 409. An alias whose link has not expired is 409.
        Generated codes never reclaim expired codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
            examples:
              generatedCode:
                summary: Generated code
                value:
                  url: https://example.com/some/long/path?x=1
              customAlias:
                summary: Custom alias
                value:
                  url: https://example.com/offsite-2026
                  customAlias: team-offsite
              expiring:
                summary: Expiring link (offset converted to UTC)
                value:
                  url: https://example.com/flash-sale
                  expiresAt: '2026-12-31T23:59:00+05:30'
              expiryWithoutZone:
                summary: Rejected - expiry without a time zone (400)
                value:
                  url: https://example.com/flash-sale
                  expiresAt: '2026-12-31T23:59:00'
              expiryInPast:
                summary: Rejected - expiry not in the future (400)
                value:
                  url: https://example.com/flash-sale
                  expiresAt: '2020-01-01T00:00:00Z'
              invalidScheme:
                summary: Rejected - javascript scheme (400)
                value:
                  url: javascript:alert(1)
              missingScheme:
                summary: Rejected - no scheme, hint to add https:// (400)
                value:
                  url: www.example.com/page
              bogusScheme:
                summary: Rejected - parses as scheme "localhost" (400)
                value:
                  url: localhost:8080
              userInfo:
                summary: Rejected - user info disguises the host (400)
                value:
                  url: https://google.com@evil.example/login
              selfHost:
                summary: Rejected - points at the shortener itself (400)
                value:
                  url: http://LOCALHOST:5058/abc1234
              reservedAlias:
                summary: Rejected - reserved alias (400)
                value:
                  url: https://example.com
                  customAlias: API
              aliasCaseConflict:
                summary: Conflict if team-offsite already exists (409)
                value:
                  url: https://example.com/other
                  customAlias: Team-Offsite
      responses:
        '201':
          description: Link created (or an expired alias reclaimed)
          headers:
            Location:
              description: URL of the link details resource
              schema:
                type: string
                example: /api/links/aZ3kP9q
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: The alias is already in use by a link that has not expired (compared ignoring letter case)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.10
                title: Alias already in use
                status: 409
                detail: The alias 'Team-Offsite' is already taken.
        '500':
          $ref: '#/components/responses/ServerError'

  /api/links/{code}:
    get:
      tags: [Links]
      operationId: getLink
      summary: Get link details and total click count
      description: |
        Public: anyone who knows the code can read its details, including for expired links.
        Reading details does not count as a click. Generated codes match case-sensitively; custom
        aliases match in any case.
      parameters:
        - $ref: '#/components/parameters/Code'
      responses:
        '200':
          description: Link details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/links/{code}/stats:
    get:
      tags: [Links]
      operationId: getLinkStats
      summary: Get click statistics for a link
      description: |
        Public, like link details; available for expired links too. Total clicks is all-time
        (including clicks counted before per-click analytics existed); daily counts and referrers
        cover clicks recorded since. Reading statistics does not count as a click.
      parameters:
        - $ref: '#/components/parameters/Code'
      responses:
        '200':
          description: Link statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkStatsResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /{code}:
    get:
      tags: [Redirect]
      operationId: redirectToOriginalUrl
      summary: Redirect to the original URL
      description: |
        Temporary redirect (302) so browsers do not cache it and every visit is counted.
        Click recording happens in the background and never delays or fails the redirect.
        Expired links return 410 and record no click.
        Hidden from the generated Swagger UI; documented here for testing.
      parameters:
        - $ref: '#/components/parameters/Code'
      responses:
        '302':
          description: Redirect to the original URL
          headers:
            Location:
              description: The original URL
              schema:
                type: string
                format: uri
                example: https://example.com/some/long/path?x=1
            Cache-Control:
              schema:
                type: string
                example: no-store
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: The link has expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.11
                title: Link expired
                status: 410
                detail: This short link has expired.

  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Health check (service and database)
      responses:
        '200':
          description: Service is up and the database is reachable
          content:
            text/plain:
              schema:
                type: string
                example: Healthy
        '503':
          description: The database is unreachable
          content:
            text/plain:
              schema:
                type: string
                example: Unhealthy

components:
  parameters:
    Code:
      name: code
      in: path
      required: true
      description: Generated code (7 chars, Base62) or custom alias (3-30 chars)
      schema:
        type: string
        minLength: 3
        maxLength: 30
        pattern: '^[A-Za-z0-9_-]{3,30}$'
        example: aZ3kP9q

  schemas:
    CreateLinkRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          maxLength: 2048
          description: |
            Absolute http or https URL with a host. Rejected: other schemes, missing scheme,
            user info (`user@host`), and the shortener's own host. Leading and trailing
            whitespace is trimmed.
          example: https://example.com/some/long/path?x=1
        customAlias:
          type: string
          nullable: true
          minLength: 3
          maxLength: 30
          pattern: '^[A-Za-z0-9_-]+$'
          description: |
            Optional. Letters, digits, `-` and `_`. Unique ignoring case and keeps the case it was
            created with. Reserved (any case): api, health, swagger, admin, static, assets.
          example: team-offsite
        expiresAt:
          type: string
          nullable: true
          description: |
            Optional expiry, ISO 8601 with an explicit zone (`Z` or an offset such as `+05:30`);
            must be in the future. Stored and returned in UTC. A date-time without a zone is rejected.
          example: '2026-12-31T23:59:00+05:30'

    LinkResponse:
      type: object
      required: [code, shortUrl, originalUrl, createdAtUtc, expiresAtUtc, clickCount]
      properties:
        code:
          type: string
          example: aZ3kP9q
        shortUrl:
          type: string
          format: uri
          example: http://localhost:5058/aZ3kP9q
        originalUrl:
          type: string
          format: uri
          example: https://example.com/some/long/path?x=1
        createdAtUtc:
          type: string
          format: date-time
          example: '2026-10-10T13:45:00Z'
        expiresAtUtc:
          type: string
          format: date-time
          nullable: true
          description: Expiry in UTC; null when the link never expires
          example: '2026-12-31T18:29:00Z'
        clickCount:
          type: integer
          format: int64
          minimum: 0
          description: All-time total; eventually consistent (within 5 seconds of a redirect)
          example: 0

    LinkStatsResponse:
      type: object
      required: [code, totalClicks, dailyClicks, topReferrers]
      properties:
        code:
          type: string
          example: aZ3kP9q
        totalClicks:
          type: integer
          format: int64
          minimum: 0
          example: 5
        dailyClicks:
          type: array
          description: Exactly 30 entries, oldest first, ending today (UTC); 0 for days without clicks
          minItems: 30
          maxItems: 30
          items:
            type: object
            required: [date, clicks]
            properties:
              date:
                type: string
                format: date
                example: '2026-10-11'
              clicks:
                type: integer
                format: int64
                minimum: 0
                example: 5
        topReferrers:
          type: array
          description: Up to 5 sources by all-time clicks (highest first, ties alphabetical); `(direct)` = no referrer
          maxItems: 5
          items:
            type: object
            required: [source, clicks]
            properties:
              source:
                type: string
                example: news.example
              clicks:
                type: integer
                format: int64
                minimum: 1
                example: 3

    ProblemDetails:
      type: object
      description: RFC 7807 problem details. Extra members (e.g. `traceId`) may be present.
      additionalProperties: true
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string

    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              description: Error messages keyed by request field name (`url`, `customAlias`)
              additionalProperties:
                type: array
                items:
                  type: string

  responses:
    ValidationError:
      description: Invalid request (URL, alias, or expiry rules); errors keyed by `url`, `customAlias`, `expiresAt`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc9110#section-15.5.1
            title: One or more validation errors occurred.
            status: 400
            errors:
              url:
                - The URL must start with http:// or https://. Did you mean https://www.example.com/page?
    NotFound:
      description: No link with this code
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc9110#section-15.5.5
            title: Not Found
            status: 404
    ServerError:
      description: Unexpected error, or no unique code could be generated after 5 attempts
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc9110#section-15.6.1
            title: An error occurred while processing your request.
            status: 500
